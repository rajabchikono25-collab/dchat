[network]
listen_addresses = ["/ip4/0.0.0.0/tcp/7070"]
bootstrap_peers = []
max_connections = 100
connection_timeout_ms = 10000
enable_mdns = true
enable_upnp = true
external_address = "/ip4/4.221.211.71/tcp/7070"

[storage]
data_dir = "/home/azureuser/.dchat"
max_message_cache_size = 10000
message_retention_days = 30
enable_backup = true
backup_interval_hours = 24
db_pool_size = 10
db_connection_timeout_secs = 30
db_idle_timeout_secs = 600
db_max_lifetime_secs = 1800
db_enable_wal = true

[crypto]
key_rotation_interval_hours = 168
max_messages_per_key = 10000
enable_post_quantum = false
noise_protocol_pattern = "Noise_XX_25519_ChaChaPoly_BLAKE2s"

[governance]
voting_period_hours = 168
minimum_stake_for_proposal = 1000
quorum_threshold = 0.5
enable_anonymous_voting = true

[relay]
enable_relay = false
max_relay_connections = 50
relay_reward_threshold = 100
uptime_reporting_interval_minutes = 15
stake_amount = 1000
