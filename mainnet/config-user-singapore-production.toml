# dchat Mainnet Configuration - User Client (Singapore)
# Server: user.singapore.schikuno.top (18.140.247.242)
# Production Config

[network]
listen_addresses = ["/ip4/0.0.0.0/tcp/7070", "/ip4/0.0.0.0/udp/7070/quic-v1"]
bootstrap_peers = [
    "/dns4/validator.india.schikuno.top/tcp/7070",
    "/dns4/validator.southafrica.schikuno.top/tcp/7070",
    "/dns4/validator.uae.schikuno.top/tcp/7070",
    "/dns4/relay.ohio.schikuno.top/tcp/7070",
    "/dns4/relay.saopaulo.schikuno.top/tcp/7070"
]
max_connections = 50
connection_timeout_ms = 30000
enable_mdns = false
enable_upnp = true
enable_dht = true

[storage]
data_dir = "/opt/dchat/data"
max_message_cache_size = 10000
message_retention_days = 90
enable_backup = false
db_pool_size = 10
db_connection_timeout_secs = 30
db_idle_timeout_secs = 300
db_max_lifetime_secs = 900
db_enable_wal = true

# Redis for local caching
redis_url = "redis://127.0.0.1:6379"

[crypto]
key_rotation_interval_hours = 168
max_messages_per_key = 100000
enable_post_quantum = true
noise_protocol_pattern = "Noise_XX_25519_ChaChaPoly_BLAKE2s"

[user]
username = "dchat-user-singapore"
non_interactive = true

[observability]
metrics_enabled = true
metrics_addr = "0.0.0.0:9090"
health_check_addr = "0.0.0.0:8080"
log_level = "info"

[deployment]
environment = "production"
network_name = "dchat-foundation-mainnet"
node_name = "user-singapore"
