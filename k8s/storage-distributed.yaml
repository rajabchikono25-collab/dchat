# Distributed Storage Infrastructure for dchat Production Network
# 
# This file contains Kubernetes manifests for all 4 storage tiers:
# 1. CockroachDB (distributed SQL)
# 2. Redis Cluster (distributed cache)
# 3. MinIO (distributed object storage)
# 4. TiKV (distributed KV store for blockchain state)
#
# Deploy with: kubectl apply -f k8s/storage-distributed.yaml

apiVersion: v1
kind: Namespace
metadata:
  name: dchat-storage
  labels:
    app.kubernetes.io/name: dchat-storage
    app.kubernetes.io/component: infrastructure

---
# ============================================================================
# Tier 1: CockroachDB (Distributed SQL Database)
# ============================================================================

apiVersion: v1
kind: Service
metadata:
  name: cockroachdb
  namespace: dchat-storage
  labels:
    app: cockroachdb
spec:
  clusterIP: None  # Headless service for StatefulSet
  selector:
    app: cockroachdb
  ports:
  - name: grpc
    port: 26257
    targetPort: 26257
  - name: http
    port: 8080
    targetPort: 8080

---
apiVersion: v1
kind: Service
metadata:
  name: cockroachdb-public
  namespace: dchat-storage
  labels:
    app: cockroachdb
spec:
  type: LoadBalancer
  selector:
    app: cockroachdb
  ports:
  - name: grpc
    port: 26257
    targetPort: 26257
    protocol: TCP
  - name: http
    port: 8080
    targetPort: 8080
    protocol: TCP

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: cockroachdb
  namespace: dchat-storage
spec:
  serviceName: cockroachdb
  replicas: 5  # 5 nodes for multi-region deployment
  selector:
    matchLabels:
      app: cockroachdb
  template:
    metadata:
      labels:
        app: cockroachdb
    spec:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchExpressions:
              - key: app
                operator: In
                values:
                - cockroachdb
            topologyKey: kubernetes.io/hostname
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - cockroachdb
              topologyKey: topology.kubernetes.io/region
      containers:
      - name: cockroachdb
        image: cockroachdb/cockroach:v23.1.11
        imagePullPolicy: IfNotPresent
        command:
          - "/bin/bash"
          - "-ecx"
          - |
            exec /cockroach/cockroach start \
             --logtostderr \
             --insecure \
             --advertise-addr=$(hostname -f) \
             --http-addr=0.0.0.0 \
             --join=cockroachdb-0.cockroachdb.dchat-storage.svc.cluster.local,cockroachdb-1.cockroachdb.dchat-storage.svc.cluster.local,cockroachdb-2.cockroachdb.dchat-storage.svc.cluster.local \
             --cache=25% \
             --max-sql-memory=25%
        ports:
        - containerPort: 26257
          name: grpc
        - containerPort: 8080
          name: http
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 30
          periodSeconds: 5
        readinessProbe:
          httpGet:
            path: /health?ready=1
            port: http
          initialDelaySeconds: 10
          periodSeconds: 5
        resources:
          requests:
            cpu: 2000m
            memory: 8Gi
          limits:
            cpu: 4000m
            memory: 16Gi
        volumeMounts:
        - name: datadir
          mountPath: /cockroach/cockroach-data
  volumeClaimTemplates:
  - metadata:
      name: datadir
    spec:
      accessModes: ["ReadWriteOnce"]
      storageClassName: fast-ssd
      resources:
        requests:
          storage: 500Gi

---
# ============================================================================
# Tier 2: Redis Cluster (Distributed Cache)
# ============================================================================

apiVersion: v1
kind: ConfigMap
metadata:
  name: redis-cluster-config
  namespace: dchat-storage
data:
  redis.conf: |
    cluster-enabled yes
    cluster-config-file /data/nodes.conf
    cluster-node-timeout 5000
    appendonly yes
    appendfilename "appendonly.aof"
    dir /data
    save 900 1
    save 300 10
    save 60 10000
    maxmemory 4gb
    maxmemory-policy allkeys-lru

---
apiVersion: v1
kind: Service
metadata:
  name: redis-cluster
  namespace: dchat-storage
  labels:
    app: redis-cluster
spec:
  clusterIP: None
  selector:
    app: redis-cluster
  ports:
  - name: redis
    port: 6379
    targetPort: 6379
  - name: cluster
    port: 16379
    targetPort: 16379

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis-cluster
  namespace: dchat-storage
spec:
  serviceName: redis-cluster
  replicas: 6  # 3 masters + 3 replicas
  selector:
    matchLabels:
      app: redis-cluster
  template:
    metadata:
      labels:
        app: redis-cluster
    spec:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchExpressions:
              - key: app
                operator: In
                values:
                - redis-cluster
            topologyKey: kubernetes.io/hostname
      containers:
      - name: redis
        image: redis:7.2-alpine
        command:
          - "redis-server"
        args:
          - "/conf/redis.conf"
        ports:
        - containerPort: 6379
          name: redis
        - containerPort: 16379
          name: cluster
        livenessProbe:
          exec:
            command:
            - redis-cli
            - ping
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          exec:
            command:
            - redis-cli
            - ping
          initialDelaySeconds: 5
          periodSeconds: 5
        resources:
          requests:
            cpu: 500m
            memory: 2Gi
          limits:
            cpu: 2000m
            memory: 8Gi
        volumeMounts:
        - name: conf
          mountPath: /conf
        - name: data
          mountPath: /data
      volumes:
      - name: conf
        configMap:
          name: redis-cluster-config
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes: ["ReadWriteOnce"]
      storageClassName: fast-ssd
      resources:
        requests:
          storage: 50Gi

---
# ============================================================================
# Tier 3: MinIO (Distributed Object Storage)
# ============================================================================

apiVersion: v1
kind: Service
metadata:
  name: minio
  namespace: dchat-storage
  labels:
    app: minio
spec:
  clusterIP: None
  selector:
    app: minio
  ports:
  - name: api
    port: 9000
    targetPort: 9000
  - name: console
    port: 9001
    targetPort: 9001

---
apiVersion: v1
kind: Service
metadata:
  name: minio-public
  namespace: dchat-storage
  labels:
    app: minio
spec:
  type: LoadBalancer
  selector:
    app: minio
  ports:
  - name: api
    port: 9000
    targetPort: 9000
  - name: console
    port: 9001
    targetPort: 9001

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: minio
  namespace: dchat-storage
spec:
  serviceName: minio
  replicas: 4  # Distributed across zones for erasure coding
  selector:
    matchLabels:
      app: minio
  template:
    metadata:
      labels:
        app: minio
    spec:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchExpressions:
              - key: app
                operator: In
                values:
                - minio
            topologyKey: kubernetes.io/hostname
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - minio
              topologyKey: topology.kubernetes.io/zone
      containers:
      - name: minio
        image: minio/minio:RELEASE.2023-11-01T18-37-25Z
        command:
          - "/bin/bash"
          - "-c"
        args:
          - "minio server http://minio-{0...3}.minio.dchat-storage.svc.cluster.local/data --console-address ':9001'"
        env:
        - name: MINIO_ROOT_USER
          value: "admin"
        - name: MINIO_ROOT_PASSWORD
          value: "minio123"  # Change in production!
        ports:
        - containerPort: 9000
          name: api
        - containerPort: 9001
          name: console
        livenessProbe:
          httpGet:
            path: /minio/health/live
            port: api
          initialDelaySeconds: 120
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /minio/health/ready
            port: api
          initialDelaySeconds: 30
          periodSeconds: 10
        resources:
          requests:
            cpu: 1000m
            memory: 4Gi
          limits:
            cpu: 4000m
            memory: 16Gi
        volumeMounts:
        - name: data
          mountPath: /data
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes: ["ReadWriteOnce"]
      storageClassName: fast-ssd
      resources:
        requests:
          storage: 1Ti

---
# ============================================================================
# Tier 4: TiKV (Distributed KV Store for Blockchain State)
# ============================================================================

# TiKV Placement Driver (PD) Service
apiVersion: v1
kind: Service
metadata:
  name: tikv-pd
  namespace: dchat-storage
  labels:
    app: tikv-pd
spec:
  clusterIP: None
  selector:
    app: tikv-pd
  ports:
  - name: client
    port: 2379
    targetPort: 2379
  - name: peer
    port: 2380
    targetPort: 2380

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: tikv-pd
  namespace: dchat-storage
spec:
  serviceName: tikv-pd
  replicas: 3  # 3 PD nodes for quorum
  selector:
    matchLabels:
      app: tikv-pd
  template:
    metadata:
      labels:
        app: tikv-pd
    spec:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchExpressions:
              - key: app
                operator: In
                values:
                - tikv-pd
            topologyKey: kubernetes.io/hostname
      containers:
      - name: pd
        image: pingcap/pd:v7.5.0
        command:
          - "/pd-server"
        args:
          - "--name=$(POD_NAME)"
          - "--data-dir=/var/lib/pd"
          - "--peer-urls=http://0.0.0.0:2380"
          - "--advertise-peer-urls=http://$(POD_NAME).tikv-pd.dchat-storage.svc.cluster.local:2380"
          - "--client-urls=http://0.0.0.0:2379"
          - "--advertise-client-urls=http://$(POD_NAME).tikv-pd.dchat-storage.svc.cluster.local:2379"
          - "--initial-cluster=tikv-pd-0=http://tikv-pd-0.tikv-pd.dchat-storage.svc.cluster.local:2380,tikv-pd-1=http://tikv-pd-1.tikv-pd.dchat-storage.svc.cluster.local:2380,tikv-pd-2=http://tikv-pd-2.tikv-pd.dchat-storage.svc.cluster.local:2380"
        env:
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        ports:
        - containerPort: 2379
          name: client
        - containerPort: 2380
          name: peer
        resources:
          requests:
            cpu: 500m
            memory: 1Gi
          limits:
            cpu: 2000m
            memory: 4Gi
        volumeMounts:
        - name: data
          mountPath: /var/lib/pd
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes: ["ReadWriteOnce"]
      storageClassName: fast-ssd
      resources:
        requests:
          storage: 50Gi

---
# TiKV Service
apiVersion: v1
kind: Service
metadata:
  name: tikv
  namespace: dchat-storage
  labels:
    app: tikv
spec:
  clusterIP: None
  selector:
    app: tikv
  ports:
  - name: server
    port: 20160
    targetPort: 20160

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: tikv
  namespace: dchat-storage
spec:
  serviceName: tikv
  replicas: 3  # 3 TiKV nodes for replication
  selector:
    matchLabels:
      app: tikv
  template:
    metadata:
      labels:
        app: tikv
    spec:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchExpressions:
              - key: app
                operator: In
                values:
                - tikv
            topologyKey: kubernetes.io/hostname
      containers:
      - name: tikv
        image: pingcap/tikv:v7.5.0
        command:
          - "/tikv-server"
        args:
          - "--addr=0.0.0.0:20160"
          - "--advertise-addr=$(POD_NAME).tikv.dchat-storage.svc.cluster.local:20160"
          - "--data-dir=/var/lib/tikv"
          - "--pd=tikv-pd-0.tikv-pd.dchat-storage.svc.cluster.local:2379,tikv-pd-1.tikv-pd.dchat-storage.svc.cluster.local:2379,tikv-pd-2.tikv-pd.dchat-storage.svc.cluster.local:2379"
        env:
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        ports:
        - containerPort: 20160
          name: server
        resources:
          requests:
            cpu: 2000m
            memory: 8Gi
          limits:
            cpu: 8000m
            memory: 32Gi
        volumeMounts:
        - name: data
          mountPath: /var/lib/tikv
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes: ["ReadWriteOnce"]
      storageClassName: fast-ssd
      resources:
        requests:
          storage: 500Gi

---
# ============================================================================
# Monitoring (ServiceMonitor for Prometheus)
# ============================================================================

apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: storage-metrics
  namespace: dchat-storage
spec:
  selector:
    matchLabels:
      app: cockroachdb
  endpoints:
  - port: http
    interval: 30s
    path: /_status/vars
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: redis-metrics
  namespace: dchat-storage
spec:
  selector:
    matchLabels:
      app: redis-cluster
  endpoints:
  - port: redis
    interval: 30s
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: minio-metrics
  namespace: dchat-storage
spec:
  selector:
    matchLabels:
      app: minio
  endpoints:
  - port: api
    interval: 30s
    path: /minio/v2/metrics/cluster
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: tikv-metrics
  namespace: dchat-storage
spec:
  selector:
    matchLabels:
      app: tikv
  endpoints:
  - port: server
    interval: 30s
    path: /metrics
