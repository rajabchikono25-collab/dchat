receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
  
  prometheus:
    config:
      scrape_configs:
        - job_name: 'otel-collector'
          scrape_interval: 10s
          static_configs:
            - targets: ['localhost:8888']

processors:
  batch:
    timeout: 10s
    send_batch_size: 1024
  
  memory_limiter:
    check_interval: 1s
    limit_mib: 4000
    spike_limit_mib: 800
  
  resource:
    attributes:
      - key: service.name
        value: dchat
        action: upsert
      - key: deployment.environment
        value: production
        action: upsert
  
  resourcedetection:
    detectors: [env, system, docker]
    timeout: 5s
  
  # Add region information from hostname
  attributes:
    actions:
      - key: region
        from_attribute: host.name
        action: extract
        pattern: ^validator1-([^.]+)\..*
  
  # Filter out noisy spans
  filter:
    spans:
      exclude:
        match_type: regexp
        span_names:
          - ^health_check.*
          - ^metrics.*

exporters:
  # Export to Prometheus
  prometheus:
    endpoint: "0.0.0.0:8889"
    namespace: dchat
    const_labels:
      cluster: mainnet
  
  # Export traces to Jaeger
  jaeger:
    endpoint: jaeger-collector:14250
    tls:
      insecure: false
      cert_file: /etc/otel/certs/cert.pem
      key_file: /etc/otel/certs/key.pem
  
  # Export to OTLP backend (e.g., Grafana Cloud, Honeycomb)
  otlp:
    endpoint: https://otlp.example.com:4317
    headers:
      Authorization: "Bearer ${OTLP_API_KEY}"
    compression: gzip
  
  # Logging exporter for debugging
  logging:
    loglevel: info
    sampling_initial: 5
    sampling_thereafter: 200

extensions:
  health_check:
    endpoint: 0.0.0.0:13133
  
  pprof:
    endpoint: 0.0.0.0:1777
  
  zpages:
    endpoint: 0.0.0.0:55679

service:
  extensions: [health_check, pprof, zpages]
  
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch, resource, resourcedetection, attributes, filter]
      exporters: [jaeger, otlp, logging]
    
    metrics:
      receivers: [otlp, prometheus]
      processors: [memory_limiter, batch, resource, resourcedetection]
      exporters: [prometheus, otlp]
    
    logs:
      receivers: [otlp]
      processors: [memory_limiter, batch, resource, resourcedetection]
      exporters: [otlp, logging]
  
  telemetry:
    logs:
      level: info
    metrics:
      level: detailed
      address: 0.0.0.0:8888
