[package]
name = "dchat-privacy"
version = "0.1.0"
edition = "2021"

license.workspace = true
[dependencies]
# Core dependencies
dchat-core = { path = "../dchat-core" }
dchat-crypto = { path = "../dchat-crypto" }

# Cryptography
curve25519-dalek = "4.1"
ed25519-dalek = "2.1"
blake3 = "1.5"
rand = "0.8"
chacha20poly1305 = "0.10"  # AEAD encryption for stealth payloads
num-bigint = "0.4"  # Big integer arithmetic for RSA blind signatures
num-integer = "0.1"  # Integer operations
num-traits = "0.2"  # Numeric traits

# Zero-knowledge proofs
# Note: Using lightweight custom implementation for now
# Future: Consider arkworks-rs or bellman for production ZK

# Serialization
serde = { version = "1.0", features = ["derive"] }

# Logging
tracing = { workspace = true }

# Error handling
thiserror = "1.0"
anyhow = "1.0"

[dev-dependencies]
tokio = { version = "1.35", features = ["full"] }
