[package]
name = "dchat-governance"
version = "0.1.0"
edition = "2021"

license.workspace = true
[dependencies]
# Core dependencies
dchat-core = { path = "../dchat-core" }
dchat-crypto = { path = "../dchat-crypto" }
dchat-privacy = { path = "../dchat-privacy" }
dchat-observability = { path = "../dchat-observability" }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Time handling
chrono = "0.4"

# Randomness
rand = "0.8"
rand_chacha = "0.3"

# UUID
uuid = { version = "1.6", features = ["v4", "serde"] }

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Async
async-trait = "0.1"
tokio = { version = "1.35", features = ["full"] }

# Lazy initialization
once_cell = "1.19"

# Hashing
blake3 = "1.5"
hex = "0.4"
sha2 = "0.10"

# Logging
tracing = "0.1"

[dev-dependencies]
tokio = { version = "1.35", features = ["full"] }
