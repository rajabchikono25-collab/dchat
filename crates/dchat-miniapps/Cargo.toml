[package]
name = "dchat-miniapps"
version = "1.0.0"
edition = "2021"
authors = ["dchat contributors"]
license = "MIT OR Apache-2.0"
description = "Telegram-style mini-app platform for dchat chat chain"
repository = "https://github.com/dchat/dchat"
keywords = ["dchat", "miniapps", "webview", "telegram", "blockchain"]
categories = ["cryptography", "web-programming"]
readme = "README.md"

[features]
default = []
# Enable client-side sandbox runtime
sandbox = []
# Enable bot bridge
bot-bridge = []
# Enable wallet integration
wallet = []
# Testing utilities
test-utils = []

[dependencies]
# Core dchat crates
dchat-core = { path = "../dchat-core" }
dchat-crypto = { path = "../dchat-crypto" }
dchat-chain = { path = "../dchat-chain" }
dchat-identity = { path = "../dchat-identity" }
dchat-messaging = { path = "../dchat-messaging" }
dchat-programs = { path = "../dchat-programs" }

# Async runtime
tokio = { version = "1.0", features = ["sync", "rt"] }
futures = "0.3"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"

# Cryptography
blake3 = "1.5"
sha2 = "0.10"
ed25519-dalek = { version = "2.0", features = ["serde"] }
rand = "0.8"

# URL and web
url = { version = "2.5", features = ["serde"] }

# UUID
uuid = { version = "1.4", features = ["v4", "serde"] }

# Concurrency
parking_lot = "0.12"
dashmap = "5.5"
crossbeam-channel = "0.5"

# Time
chrono = { version = "0.4", features = ["serde"] }

# Logging
tracing = "0.1"

# Error handling
thiserror = "1.0"

# Semver for versioning
semver = { version = "1.0", features = ["serde"] }

# Base64 for data encoding
base64 = "0.21"

# Hex encoding
hex = "0.4"

[dev-dependencies]
tokio = { version = "1.0", features = ["full", "test-util"] }
tempfile = "3.8"
criterion = "0.5"
proptest = "1.3"

[[bench]]
name = "miniapp_benchmarks"
harness = false

[lib]
name = "dchat_miniapps"
path = "src/lib.rs"
