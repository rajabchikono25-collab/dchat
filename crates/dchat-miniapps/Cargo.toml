[package]
name = "dchat-miniapps"
version = "1.0.0"
edition = "2021"
authors = ["dchat contributors"]
license = "MIT OR Apache-2.0"
description = "Telegram-style mini-app platform for dchat chat chain"
repository = "https://github.com/dchat/dchat"
keywords = ["dchat", "miniapps", "webview", "telegram", "blockchain"]
categories = ["cryptography", "web-programming"]
readme = "README.md"

[features]
default = []
# Enable client-side sandbox runtime
sandbox = []
# Enable bot bridge
bot-bridge = []
# Enable wallet integration
wallet = []
# Testing utilities
test-utils = []

[dependencies]
# Core dchat crates
dchat-core = { path = "../dchat-core" }
dchat-crypto = { path = "../dchat-crypto" }
dchat-identity = { path = "../dchat-identity" }
dchat-messaging = { path = "../dchat-messaging" }
dchat-programs = { path = "../dchat-programs" }

# Async runtime - pinned versions
tokio = { version = "1.44", features = ["sync", "rt", "time", "macros"] }
futures = { version = "0.3" }
async-trait = { version = "0.1" }

# Serialization - pinned versions
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1" }
serde_with = { version = "3", features = ["hex"] }
bincode = { version = "1" }

# Cryptography - pinned stable versions
blake3 = { version = "1" }
sha2 = { version = "0.10" }
ed25519-dalek = { version = "2", features = ["serde", "rand_core"] }
rand = { version = "0.8" }

# URL and web
url = { version = "2", features = ["serde"] }

# UUID
uuid = { version = "1", features = ["v4", "serde"] }

# Concurrency - pinned versions
parking_lot = { version = "0.12" }
dashmap = { version = "6" }
crossbeam-channel = { version = "0.5" }

# Time
chrono = { version = "0.4", features = ["serde"] }

# Logging
tracing = { version = "0.1" }

# Error handling
thiserror = { version = "2" }

# Semver for versioning
semver = { version = "1", features = ["serde"] }

# Base64 for data encoding
base64 = { version = "0.22" }

# Hex encoding
hex = { version = "0.4" }

# Metrics
prometheus = { version = "0.14" }
once_cell = { version = "1" }

# Rate limiting
governor = { version = "0.8" }

[dev-dependencies]
tokio = { version = "1.44", features = ["full", "test-util"] }
tempfile = { version = "3.14" }
criterion = { version = "0.5" }
proptest = { version = "1.5" }

[[bench]]
name = "miniapp_benchmarks"
harness = false

[[test]]
name = "permissions"
path = "tests/permissions.rs"

[[test]]
name = "intents"
path = "tests/intents.rs"

[[test]]
name = "receipts"
path = "tests/receipts.rs"

[[test]]
name = "rate_limits"
path = "tests/rate_limits.rs"

[[test]]
name = "integration"
path = "tests/integration.rs"

[lib]
name = "dchat_miniapps"
path = "src/lib.rs"
