[package]
name = "dchat-identity"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
dchat-core = { path = "../dchat-core" }
dchat-crypto = { path = "../dchat-crypto" }

# Only need libp2p PeerId type, not full dchat-network dependency
libp2p = { version = "0.54", default-features = false }

# Security: Memory zeroing for sensitive data
zeroize = { version = "1.7", features = ["derive"] }
# Security: Constant-time comparisons
subtle = "2.5"

tokio = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
bincode = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
blake3 = { workspace = true }
ed25519-dalek = { workspace = true }
curve25519-dalek = { workspace = true }
rand = { workspace = true }
hex = { workspace = true }
sha2 = "0.10"
# CSPRNG for secure challenge generation
getrandom = "0.2"
sqlx = { workspace = true }

# FROST threshold signatures (audited by NCC Group, 2023)
frost-ed25519 = "2.0"

# CBOR parsing for attestation (WebAuthn, App Attest)
ciborium = "0.2"

# X.509 certificate parsing for attestation verification
x509-parser = "0.16"
der-parser = "9.0"

# RSA for Google service account JWT signing
# SECURITY: Use 0.9.7+ to mitigate RUSTSEC-2023-0071 (Marvin timing attack)
rsa = { version = "0.9.7", features = ["sha2"] }

# Base64 encoding for attestation challenges
base64 = "0.21"

# Unicode normalization for homoglyph protection
unicode-normalization = "0.1"

# HTTP client for CAPTCHA verification and attestation APIs
reqwest = { version = "0.12", features = [
  "json",
  "rustls-tls",
], default-features = false, optional = true }

# Platform-specific dependencies for biometric/enclave support
[target.'cfg(target_os = "ios")'.dependencies]
security-framework = "2.9"

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"

[dev-dependencies]
tokio-test = "0.4"
proptest = { workspace = true }

[features]
default = []
# Enable CAPTCHA verification support (requires reqwest)
captcha = ["reqwest"]
# Enable attestation API verification (Google Play Integrity, Apple App Attest)
attestation-api = ["reqwest"]
