[package]
name = "dchat-deployment"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
toml = "0.8"
tokio = { version = "1.40", features = ["full"] }
reqwest = { version = "0.11", features = ["json"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1.0"
clap = { version = "4.0", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.0", features = ["v4"] }
bs58 = "0.5"
sha2 = "0.10"
dchat-core = { path = "../dchat-core" }

[[bin]]
name = "deploy-validators"
path = "src/bin/deploy_validators.rs"

[[bin]]
name = "deploy-relays"
path = "src/bin/deploy_relays.rs"

[[bin]]
name = "deploy-storage"
path = "src/bin/deploy-storage.rs"

[[bin]]
name = "deploy-backup"
path = "src/bin/deploy-backup.rs"

[[bin]]
name = "deploy-monitoring"
path = "src/bin/deploy-monitoring.rs"
