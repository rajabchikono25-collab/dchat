[package]
name = "ironclad-cli"
version = "0.1.0"
edition = "2021"
description = "Ironclad - DPL smart contract development framework for dchat"
license = "MIT OR Apache-2.0"
repository = "https://github.com/dchat/dchat"
keywords = ["dchat", "dpl", "smart-contracts", "blockchain", "wasm"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "ironclad"
path = "src/main.rs"

[dependencies]
# CLI framework
clap = { version = "4", features = ["derive", "env", "color"] }
clap_complete = "4"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

# Utilities
thiserror = "2.0"
hex = "0.4"
blake3 = "1.5"
sha2 = "0.10"
rand = "0.8"
shellexpand = "3"

# Async runtime
tokio = { version = "1", features = ["full"] }

# HTTP client for RPC
reqwest = { version = "0.12", features = ["json"] }

# File system
walkdir = "2"
glob = "0.3"

# Terminal output
colored = "2"
indicatif = "0.17"
console = "0.15"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3"
assert_cmd = "2"
predicates = "3"

[features]
default = []
# Enable shell completion generation
completions = []
