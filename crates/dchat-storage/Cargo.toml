[package]
name = "dchat-storage"
version = "0.1.0"
edition = "2021"

license.workspace = true
[dependencies]
# Workspace dependencies
dchat-core = { path = "../dchat-core" }
dchat-crypto = { path = "../dchat-crypto" }
# dchat-messaging = { path = "../dchat-messaging" }  # Removed to break circular dependency

# Async runtime
tokio = { workspace = true }
async-trait = { workspace = true }

# Database
sqlx = { workspace = true, features = ["postgres", "chrono", "uuid"] }

# Distributed storage
redis = { version = "0.27", features = ["cluster-async", "tokio-comp"] }

# Encryption
chacha20poly1305 = "0.10"
rand = "0.8"

# Image processing
image = "0.24"
rust-s3 = { version = "0.35", default-features = false, features = ["tokio-rustls-tls"] }
tikv-client = "0.3"

# Serialization
serde = { workspace = true }
serde_json = "1.0"
bincode = "1.3"

# Cryptography
blake3 = { workspace = true }
sha2 = "0.10"
hex = "0.4"
ed25519-dalek = { workspace = true }

# HTTP client for bond verification
reqwest = { workspace = true, features = ["multipart"] }

# Compression
zstd = "0.13"
brotli = "7.0"
lz4_flex = "0.11"

# Utilities
uuid = { workspace = true }
chrono = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }

# Resilience
parking_lot = "0.12"

[dev-dependencies]
tokio-test = "0.4"
tempfile = "3.8"
