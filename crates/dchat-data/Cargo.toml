[package]
name = "dchat-data"
version = "0.1.0"
edition = "2021"
authors = ["dchat contributors"]
description = "Shared data models and utilities for dchat - TTL, deduplication, serialization"
license = "MIT OR Apache-2.0"

[dependencies]
# Core dependencies
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
blake3 = "1.5"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1.0"
uuid = { version = "1.0", features = ["v4", "serde"] }
hex = "0.4"
base64 = "0.22"
bincode = "1.3"

[dev-dependencies]
rand = "0.8"
