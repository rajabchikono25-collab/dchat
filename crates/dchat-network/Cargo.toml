[package]
name = "dchat-network"
version = "0.1.0"
edition = "2021"

license.workspace = true
[dependencies]
# Workspace dependencies
dchat-core = { path = "../dchat-core" }
dchat-crypto = { path = "../dchat-crypto" }
dchat-identity = { path = "../dchat-identity" }

# Cryptography
sha2 = "0.10"
sha1 = "0.10"
hmac = "0.12"
hkdf = "0.12"
x25519-dalek = { workspace = true }
ed25519-dalek = { workspace = true }
chacha20poly1305 = "0.10"
aes-gcm = "0.10" # For Sphinx packet encryption

# Async runtime
tokio = { workspace = true }
async-trait = { workspace = true }

# Networking
libp2p = { version = "0.54", features = [
    "kad", "noise", "tcp", "dns", "websocket", "relay", "dcutr", 
    "mdns", "identify", "ping", "gossipsub", "yamux", "tokio",
    "macros"  # Enable NetworkBehaviour derive macro
] }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }
bincode = "1.3"

# Utilities
tracing = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true }
futures = "0.3"
blake3 = { workspace = true }
rand = { workspace = true }
hex = { workspace = true }
once_cell = "1.19" # For lazy static initialization

# HTTP client for UPnP and external services
reqwest = { version = "0.11", features = ["default"] }
quick-xml = { version = "0.31", features = ["serialize"] }

# DNS resolution for mainnet peer discovery
trust-dns-resolver = { version = "0.23", features = ["tokio-runtime"] }

# Encrypted keystore for relay keys
age = { version = "0.10", features = ["armor"] }

[dev-dependencies]
tokio-test = "0.4"
