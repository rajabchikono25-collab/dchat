[package]
name = "dchat-network"
version = "0.1.0"
edition = "2021"

license.workspace = true

[features]
default = []
metrics = ["prometheus"]
qge-integration-tests = []

[dependencies]
# Workspace dependencies
dchat-core = { path = "../dchat-core" }
dchat-crypto = { path = "../dchat-crypto" }
dchat-identity = { path = "../dchat-identity" }

# Cryptography
sha2 = "0.10"
sha1 = "0.10"
hmac = "0.12"
hkdf = "0.12"
x25519-dalek = { workspace = true }
ed25519-dalek = { workspace = true }
chacha20poly1305 = "0.10"
aes-gcm = "0.10"                     # For Sphinx packet encryption
frost-ed25519 = "2.1"                # FROST threshold signatures for epoch tokens

# Async runtime
tokio = { workspace = true }
async-trait = { workspace = true }

# Networking
libp2p = { version = "0.54", features = [
  "kad",
  "noise",
  "tcp",
  "dns",
  "websocket",
  "relay",
  "dcutr",
  "mdns",
  "identify",
  "ping",
  "gossipsub",
  "yamux",
  "tokio",
  "request-response", # For onion routing cell protocol
  "macros",           # Enable NetworkBehaviour derive macro
  "quic",             # QUIC transport for 0-RTT connections
  "rendezvous",       # Faster channel discovery
] }
libp2p-request-response = { version = "0.27", features = ["cbor"] }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }
bincode = "1.3"

# Utilities
tracing = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true }
futures = "0.3"
blake3 = { workspace = true }
rand = { workspace = true }
hex = { workspace = true }
once_cell = "1.19"               # For lazy static initialization

# Metrics (optional, to avoid circular dependency)
prometheus = { version = "0.13", optional = true }

# HTTP client for UPnP and external services
reqwest = { version = "0.11", default-features = false, features = [
  "json",
  "rustls-tls",
] }
quick-xml = { version = "0.31", features = ["serialize"] }
local-ip-address = "0.6"
regex = "1.10" # For robust XML/SOAP parsing in UPnP

# DNS resolution for mainnet peer discovery
trust-dns-resolver = { version = "0.23", features = ["tokio-runtime"] }

# Encrypted keystore for relay keys
age = { version = "0.10", features = ["armor"] }

[dev-dependencies]
tokio-test = "0.4"
