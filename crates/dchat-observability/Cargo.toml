[package]
name = "dchat-observability"
version = "0.1.0"
edition = "2021"

license.workspace = true

[features]
default = []
# Enable integration with dchat-network NAT telemetry (requires dchat-network dependency)
nat-telemetry-integration = ["dchat-network"]

[dependencies]
dchat-core = { path = "../dchat-core" }
dchat-identity = { path = "../dchat-identity" }
dchat-validator = { path = "../dchat-validator" }
dchat-network = { path = "../dchat-network", optional = true }
serde = { version = "1.0", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1.0"
uuid = { version = "1.0", features = ["v4", "serde"] }
prometheus = "0.14"
tracing = "0.1"
once_cell = "1.19"
ed25519-dalek = { workspace = true }
rand = { workspace = true }

[dev-dependencies]
