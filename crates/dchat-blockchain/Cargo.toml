[package]
name = "dchat-blockchain"
version = "0.1.0"
edition = "2021"
description = "Blockchain client for parallel chain architecture (Chat Chain + Currency Chain)"

[dependencies]
async-trait = "0.1"
base64 = "0.22"
blake3 = "1.5"
bincode = "1.3"
crossbeam-channel = "0.5"
dashmap = "5.5"
parking_lot = "0.12"
rayon = "1.10"
bs58 = "0.5"
chrono = { version = "0.4", features = ["serde"] }
dchat-chain = { path = "../dchat-chain" }
dchat-core = { path = "../dchat-core" }
dchat-crypto = { path = "../dchat-crypto" }
dchat-network = { path = "../dchat-network" }
dchat-privacy = { path = "../dchat-privacy" }
ed25519-dalek = { version = "2.1", features = ["rand_core", "serde"] }
hex = "0.4"
once_cell = "1.19"
prometheus = "0.13"
reed-solomon-erasure = "6"
reqwest = { version = "0.11", features = ["json"] }
rand = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_bytes = "0.11"
serde_json = "1.0"
sha2 = "0.10"
thiserror = "1.0"
tokio = { version = "1.0", features = ["full"] }
tokio-tungstenite = { version = "0.21", features = ["native-tls"] }
futures-util = "0.3"
tracing = "0.1"
uuid = { version = "1.0", features = ["v4", "v5", "serde"] }
zeroize = { version = "1.8", features = ["derive"] }

# BLS signatures for aggregate signature verification (BLS12-381)
blst = { version = "0.3", optional = true }

# Post-quantum cryptography (Gap Fix #1)
pqcrypto-dilithium = "0.5"
pqcrypto-traits = "0.3"

# GeoIP database integration (Gap Fix #3)
maxminddb = "0.24"

# Vote persistence layer (Gap Fix #2)
sqlx = { workspace = true, features = ["postgres", "chrono", "uuid"] }

[dev-dependencies]
tokio = { version = "1.0", features = ["full"] }

[features]
default = []
# Enable BLS signature aggregation using blst (IETF BLS12-381)
bls-aggregation = ["blst"]
# Enable hardened consensus base types (PoRW, PoT, TSC wrappers)
hardened-consensus = []
# Enable full hardened consensus integration (coordinator, all modules wired)
hardened-consensus-integration = ["hardened-consensus"]
# Enable mock RPC clients for testing - NEVER enable in production builds
# This feature is automatically enabled for tests but must be explicitly
# enabled for integration tests in other crates
test-mocks = []
