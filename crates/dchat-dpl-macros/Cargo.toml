[package]
name = "dchat-dpl-macros"
version = "0.1.0"
edition = "2021"
description = "Procedural macros for DPL (Dchat Program Language) contract authoring"
license = "MIT OR Apache-2.0"
repository = "https://github.com/dchat-network/dchat"
keywords = ["dchat", "dpl", "blockchain", "smart-contracts", "macros"]
categories = ["development-tools::procedural-macro-helpers"]

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1.0"
quote = "1.0"
syn = { version = "2.0", features = [
  "full",
  "extra-traits",
  "parsing",
  "printing",
] }

[dev-dependencies]
trybuild = "1.0"
