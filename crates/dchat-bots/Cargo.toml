[package]
name = "dchat-bots"
version = "0.1.0"
edition = "2021"

[dependencies]
dchat-core = { path = "../dchat-core" }
dchat-messaging = { path = "../dchat-messaging" }
dchat-identity = { path = "../dchat-identity" }
dchat-storage = { path = "../dchat-storage" }
dchat-blockchain = { path = "../dchat-blockchain" }
dchat-network = { path = "../dchat-network" }

# Cryptography
ed25519-dalek = { workspace = true }

# libp2p (re-exported from dchat-network but needed for types)
libp2p = { version = "0.54", default-features = false, features = [] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"

# Async runtime
tokio = { version = "1.0", features = ["full"] }
async-trait = "0.1"

# HTTP client/server
reqwest = { version = "0.11", features = ["json"] }
axum = { version = "0.7", features = ["macros"] }

# Database
sqlx = { version = "0.8", features = ["runtime-tokio-native-tls", "sqlite"] }

# Utilities
uuid = { version = "1.0", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1.0"
tracing = "0.1"
blake3 = { workspace = true }
rand = "0.8"
getrandom = "0.2"

# Webhooks and encryption
hmac = "0.12"
sha2 = "0.10"
base64 = "0.21"
hex = "0.4"
age = "0.10"
subtle = "2.5"  # For constant-time comparisons

# URL encoding for API calls
urlencoding = "2.1"

# Noise Protocol for encryption
snow = { workspace = true }

[dev-dependencies]
tokio-test = "0.4"
tempfile = "3.8"
