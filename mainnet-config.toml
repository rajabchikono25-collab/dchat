# Pool Configuration
# Initial token allocation for protocol pools
[pools]
staking_initial = 300000000    # 30% - Validator/Relay staking rewards
rewards_initial = 200000000    # 20% - User and delivery rewards
liquidity_initial = 100000000  # 10% - Exchange liquidity
foundation_initial = 200000000 # 20% - Foundation treasury
# Remaining 20% distributed to validators as initial stake
