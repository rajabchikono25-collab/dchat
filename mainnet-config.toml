# DChat Mainnet Configuration
# This file configures the mainnet deployment for foundation servers

# Chain Configuration
chain_id = "dchat-mainnet-1"
currency_chain_rpc = "http://localhost:26657"
chat_chain_rpc = "http://localhost:26658"
initial_supply = 1000000000  # 1 billion tokens

# Foundation Servers
# These are the initial validators and relays for mainnet launch
# Each server needs to be funded with stake from genesis allocation

[[foundation_servers]]
name = "validator-india"
dns = "validator.india.schikuno.top"
ip = "74.225.183.196"
node_type = "validator"
stake = 10000000  # 10M tokens
port = 7070

