[package]
name = "dpl-escrow-ironclad"
version = "0.1.0"
edition = "2021"
description = "DPL Escrow Contract - demonstrates ironclad manifest system"
license = "MIT OR Apache-2.0"
authors = ["dchat contributors"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
dchat-dpl = { path = "../../../crates/dchat-dpl", features = ["std"] }
borsh = "1.6"

[build-dependencies]
dchat-dpl = { path = "../../../crates/dchat-dpl", features = ["build"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[features]
# Enable schema verification in release builds
release-verify = []
