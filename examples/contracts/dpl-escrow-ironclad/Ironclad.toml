[project]
name = "dpl-escrow-ironclad"
version = "0.1.0"
description = "Escrow program with initialize, release, cancel, dispute, and resolve"

[build]
target = "wasm32-unknown-unknown"
generate_idl = true
verify_schema = false

[networks.localnet]
url = "http://localhost:8545"
confirm = true

[networks.devnet]
url = "https://devnet.dchat.network"
confirm = true

[networks.testnet]
url = "https://testnet.dchat.network"
confirm = true

[networks.mainnet]
url = "https://mainnet.dchat.network"
confirm = true

[test]
timeout = 300
parallel = true

[idl]
output_dir = "idl"
