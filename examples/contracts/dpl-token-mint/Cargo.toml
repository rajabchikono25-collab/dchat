[package]
name = "dpl-token-mint"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
dchat-dpl = { path = "../../../crates/dchat-dpl", features = ["std"] }
dchat-dpl-macros = { path = "../../../crates/dchat-dpl-macros" }
serde = { version = "1.0", features = ["derive"] }

[profile.release]
opt-level = "z"
lto = true
strip = true
codegen-units = 1
panic = "abort"

[target.'cfg(target_arch = "wasm32")'.dependencies]
# No additional deps needed for wasm32
