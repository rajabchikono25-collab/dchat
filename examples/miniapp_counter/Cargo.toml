[package]
name = "miniapp-counter-example"
version = "0.1.0"
edition = "2021"
description = "A simple counter mini-app example for dchat"
license = "MIT OR Apache-2.0"
publish = false

# Keep this example out of the workspace
[workspace]

[[bin]]
name = "miniapp_counter"
path = "src/main.rs"

[[bin]]
name = "sandbox_host"
path = "src/sandbox_host.rs"

[dependencies]
dchat-miniapps = { path = "../../crates/dchat-miniapps" }
dchat-core = { path = "../../crates/dchat-core" }
dchat-crypto = { path = "../../crates/dchat-crypto" }
dchat-identity = { path = "../../crates/dchat-identity" }

tokio = { version = "1.44", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
ed25519-dalek = { version = "2", features = ["serde", "rand_core"] }
rand = "0.8"
blake3 = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2"
semver = "1"
hex = "0.4"

# For sandbox host
axum = { version = "0.7", features = ["ws"] }
tower-http = { version = "0.6", features = ["fs"] }
futures = "0.3"
parking_lot = "0.12"
