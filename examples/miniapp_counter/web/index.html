<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Counter Mini-App</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="container">
      <header>
        <h1>🔢 Counter</h1>
        <p class="subtitle">dchat Mini-App Demo</p>
      </header>

      <main>
        <div class="counter-display">
          <span id="counter-value">0</span>
        </div>

        <div class="button-row">
          <button
            id="btn-decrement"
            class="btn btn-secondary"
            aria-label="Decrement"
          >
            <span class="btn-icon">−</span>
          </button>
          <button
            id="btn-increment"
            class="btn btn-primary"
            aria-label="Increment"
          >
            <span class="btn-icon">+</span>
          </button>
        </div>

        <div class="button-row">
          <button id="btn-reset" class="btn btn-outline">Reset</button>
          <button id="btn-set" class="btn btn-outline">Set Value</button>
        </div>

        <div class="stats">
          <div class="stat">
            <span class="stat-value" id="total-increments">0</span>
            <span class="stat-label">Increments</span>
          </div>
          <div class="stat">
            <span class="stat-value" id="total-decrements">0</span>
            <span class="stat-label">Decrements</span>
          </div>
        </div>
      </main>

      <footer>
        <div id="connection-status" class="status status-connecting">
          Connecting to dchat...
        </div>
        <div id="last-action" class="last-action"></div>
      </footer>
    </div>

    <!-- Set Value Modal -->
    <div id="modal-overlay" class="modal-overlay hidden">
      <div class="modal">
        <h2>Set Counter Value</h2>
        <input type="number" id="set-value-input" placeholder="Enter value" />
        <div class="modal-buttons">
          <button id="modal-cancel" class="btn btn-outline">Cancel</button>
          <button id="modal-confirm" class="btn btn-primary">Set</button>
        </div>
      </div>
    </div>

    <script src="dchat-sdk.js"></script>
    <script src="app.js"></script>
  </body>
</html>
