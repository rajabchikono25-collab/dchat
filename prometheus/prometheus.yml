global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'dchat-mainnet'
    environment: 'production'

# Alertmanager configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - 'alertmanager:9093'

# Load alerting rules
rule_files:
  - 'alerts.yml'

# Scrape configurations
scrape_configs:
  # dChat validator nodes
  - job_name: 'dchat-validators'
    scrape_interval: 15s
    static_configs:
      - targets:
          - 'validator1-ohio.schikuno.top:9090'
          - 'validator1-singapore.schikuno.top:9090'
          - 'validator1-stockholm.schikuno.top:9090'
          - 'validator1-south-africa.schikuno.top:9090'
          - 'validator1-india.schikuno.top:9090'
          - 'validator1-sydney.schikuno.top:9090'
          - 'validator1-uae.schikuno.top:9090'
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
      - source_labels: [__address__]
        regex: '([^:]+).*'
        target_label: region
        replacement: '$1'

  # dChat relay nodes (autodiscovery via DNS)
  - job_name: 'dchat-relays'
    scrape_interval: 15s
    dns_sd_configs:
      - names:
          - 'relay._dchat._tcp.schikuno.top'
        type: 'SRV'
        refresh_interval: 30s
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance

  # System metrics (node_exporter)
  - job_name: 'node'
    scrape_interval: 15s
    static_configs:
      - targets:
          - 'validator1-ohio.schikuno.top:9100'
          - 'validator1-singapore.schikuno.top:9100'
          - 'validator1-stockholm.schikuno.top:9100'
          - 'validator1-south-africa.schikuno.top:9100'
          - 'validator1-india.schikuno.top:9100'
          - 'validator1-sydney.schikuno.top:9100'
          - 'validator1-uae.schikuno.top:9100'

  # Distributed storage metrics
  - job_name: 'dchat-storage'
    scrape_interval: 30s
    static_configs:
      # CockroachDB metrics
      - targets:
          - 'validator1-ohio.schikuno.top:8080'
          - 'validator1-singapore.schikuno.top:8080'
          - 'validator1-stockholm.schikuno.top:8080'
        labels:
          service: 'cockroachdb'
      
      # Redis Cluster metrics (via redis_exporter)
      - targets:
          - 'validator1-ohio.schikuno.top:9121'
          - 'validator1-singapore.schikuno.top:9121'
          - 'validator1-stockholm.schikuno.top:9121'
        labels:
          service: 'redis'
      
      # MinIO metrics
      - targets:
          - 'validator1-ohio.schikuno.top:9000'
          - 'validator1-singapore.schikuno.top:9000'
          - 'validator1-stockholm.schikuno.top:9000'
        labels:
          service: 'minio'
      
      # TiKV metrics
      - targets:
          - 'validator1-ohio.schikuno.top:2379'
          - 'validator1-singapore.schikuno.top:2379'
          - 'validator1-stockholm.schikuno.top:2379'
        labels:
          service: 'tikv'

  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

# Remote write configuration for long-term storage (optional)
# remote_write:
#   - url: 'https://prometheus-remote-write.example.com/api/v1/write'
#     basic_auth:
#       username: 'dchat'
#       password: 'YOUR_PASSWORD'

# Remote read configuration (optional)
# remote_read:
#   - url: 'https://prometheus-remote-read.example.com/api/v1/read'
#     basic_auth:
#       username: 'dchat'
#       password: 'YOUR_PASSWORD'
