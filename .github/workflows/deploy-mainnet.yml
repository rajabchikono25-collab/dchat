name: Deploy to Mainnet

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to deploy (must be a release tag, e.g., v1.0.0)'
        required: true
        type: string
      deployment_type:
        description: 'Type of deployment'
        required: true
        type: choice
        options:
          - full-deployment
          - validators-only
          - relays-only
          - rollback
      confirm_mainnet:
        description: 'Type "DEPLOY-TO-MAINNET" to confirm (all caps)'
        required: true
        type: string
      skip_smoke_tests:
        description: 'Skip smoke tests (NOT recommended for mainnet)'
        required: false
        type: boolean
        default: false

env:
  CARGO_TERM_COLOR: always
  DOCKER_REGISTRY: ghcr.io
  IMAGE_NAME: dchat/dchat
  MAINNET_GENESIS_HASH: ${{ secrets.MAINNET_GENESIS_HASH }}
  MAINNET_CHAIN_ID: dchat-mainnet-1

jobs:
  validate-mainnet-deployment:
    name: Validate Mainnet Deployment Request
    runs-on: ubuntu-latest
    steps:
      - name: Validate confirmation phrase
        run: |
          if [ "${{ github.event.inputs.confirm_mainnet }}" != "DEPLOY-TO-MAINNET" ]; then
            echo "❌ Invalid confirmation. Must type 'DEPLOY-TO-MAINNET' (all caps)"
            exit 1
          fi

      - name: Validate version format
        run: |
          if ! echo "${{ github.event.inputs.version }}" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "❌ Invalid version format. Must be semver with 'v' prefix (e.g., v1.0.0)"
            exit 1
          fi

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.version }}
          fetch-depth: 0

      - name: Verify release tag exists
        run: |
          if ! git tag | grep -q "^${{ github.event.inputs.version }}$"; then
            echo "❌ Release tag ${{ github.event.inputs.version }} does not exist"
            exit 1
          fi

      - name: Verify tag is signed
        run: |
          if ! git verify-tag "${{ github.event.inputs.version }}" 2>/dev/null; then
            echo "⚠️  Warning: Tag is not GPG signed"
          fi

      - name: Check if mainnet deployment has approvals
        uses: actions/github-script@v7
        with:
          script: |
            const issue_number = context.issue.number || 0;
            if (issue_number === 0) {
              console.log('⚠️  No associated issue/PR for approval tracking');
              return;
            }
            
            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue_number
            });
            
            const approvals = comments.data.filter(c => 
              c.body.includes('APPROVE_MAINNET_DEPLOYMENT')
            );
            
            if (approvals.length < 2) {
              console.log('⚠️  Warning: Less than 2 approvals found');
            }

  pre-deployment-security-audit:
    name: Pre-Deployment Security Audit
    runs-on: ubuntu-latest
    needs: validate-mainnet-deployment
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.version }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: Security audit
        run: |
          cargo install cargo-audit
          cargo audit --deny warnings

      - name: Check for mock code in release
        run: |
          echo "🔍 Checking for mock implementations..."
          if cargo build --release 2>&1 | grep -i "MockStaking\|MockValidator"; then
            echo "❌ CRITICAL: Mock code detected in release build!"
            exit 1
          fi
          echo "✅ No mock code detected"

      - name: Verify production safety checks
        run: |
          cargo clippy --release -- \
            -D clippy::panic \
            -D clippy::unwrap_used \
            -D clippy::expect_used \
            -D clippy::exit

      - name: Check for hardcoded secrets
        run: |
          if grep -r "passphrase\|secret_key\|private_key" --include="*.rs" src/ | grep -v "// Example\|TODO"; then
            echo "❌ Potential hardcoded secrets found!"
            exit 1
          fi

  build-mainnet-binaries:
    name: Build Mainnet Binaries
    runs-on: ${{ matrix.os }}
    needs: pre-deployment-security-audit
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: dchat-linux-amd64
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            artifact_name: dchat-linux-arm64
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.version }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross-compilation tools
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build release binary
        run: |
          cargo build --release --target ${{ matrix.target }} --verbose
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc

      - name: Strip binary
        run: |
          strip target/${{ matrix.target }}/release/dchat || true

      - name: Generate checksums
        run: |
          cd target/${{ matrix.target }}/release
          sha256sum dchat > dchat.sha256
          cat dchat.sha256

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}-${{ github.event.inputs.version }}
          path: |
            target/${{ matrix.target }}/release/dchat
            target/${{ matrix.target }}/release/dchat.sha256
          retention-days: 90

  build-mainnet-docker:
    name: Build Mainnet Docker Images
    runs-on: ubuntu-latest
    needs: pre-deployment-security-audit
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.version }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.DOCKER_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ github.event.inputs.version }}
            type=raw,value=mainnet-latest
            type=semver,pattern={{version}},value=${{ github.event.inputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ github.event.inputs.version }}

      - name: Build and push mainnet Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64
          build-args: |
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
            VCS_REF=${{ github.sha }}
            VERSION=${{ github.event.inputs.version }}
            CHAIN_ID=${{ env.MAINNET_CHAIN_ID }}

      - name: Scan Docker image for vulnerabilities
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.event.inputs.version }}
          format: 'sarif'
          output: 'trivy-mainnet.sarif'
          exit-code: '1'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-mainnet.sarif'

  deploy-mainnet-validators:
    name: Deploy Mainnet Validator Nodes
    runs-on: ubuntu-latest
    needs: [build-mainnet-binaries, build-mainnet-docker]
    if: |
      github.event.inputs.deployment_type == 'full-deployment' ||
      github.event.inputs.deployment_type == 'validators-only'
    environment:
      name: mainnet-validators
      url: https://validators.dchat.network
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.version }}

      - name: Configure Kubernetes
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.MAINNET_KUBECONFIG }}" | base64 -d > ~/.kube/config

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: '3.13.0'

      - name: Create validator secrets
        run: |
          kubectl create namespace mainnet --dry-run=client -o yaml | kubectl apply -f -
          kubectl create secret generic validator-keys \
            --from-literal=validator-key="${{ secrets.MAINNET_VALIDATOR_KEY }}" \
            --namespace mainnet \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy validators with Helm
        run: |
          helm upgrade --install dchat-validators ./helm/dchat-validator \
            --namespace mainnet \
            --create-namespace \
            --set image.repository=${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME }} \
            --set image.tag=${{ github.event.inputs.version }} \
            --set chainId=${{ env.MAINNET_CHAIN_ID }} \
            --set genesisHash=${{ env.MAINNET_GENESIS_HASH }} \
            --set validators.count=5 \
            --set validators.stakeAmount=100000 \
            --values ./helm/dchat-validator/values-mainnet.yaml \
            --wait \
            --timeout 20m

      - name: Verify validator deployment
        run: |
          kubectl rollout status statefulset/dchat-validators -n mainnet --timeout=15m
          kubectl get pods -n mainnet -l app=dchat-validator

      - name: Check validator consensus
        run: |
          sleep 60
          kubectl logs -n mainnet -l app=dchat-validator --tail=50 | grep -i "consensus\|block"

  deploy-mainnet-relays:
    name: Deploy Mainnet Relay Nodes
    runs-on: ubuntu-latest
    needs: [build-mainnet-docker]
    if: |
      github.event.inputs.deployment_type == 'full-deployment' ||
      github.event.inputs.deployment_type == 'relays-only'
    environment:
      name: mainnet-relays
      url: https://relay.dchat.network
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.version }}

      - name: Configure Kubernetes
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.MAINNET_KUBECONFIG }}" | base64 -d > ~/.kube/config

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: '3.13.0'

      - name: Deploy relay nodes with Helm
        run: |
          helm upgrade --install dchat-relays ./helm/dchat-relay \
            --namespace mainnet \
            --create-namespace \
            --set image.repository=${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME }} \
            --set image.tag=${{ github.event.inputs.version }} \
            --set chainId=${{ env.MAINNET_CHAIN_ID }} \
            --set relays.count=10 \
            --set autoscaling.enabled=true \
            --set autoscaling.minReplicas=10 \
            --set autoscaling.maxReplicas=50 \
            --values ./helm/dchat-relay/values-mainnet.yaml \
            --wait \
            --timeout 15m

      - name: Verify relay deployment
        run: |
          kubectl rollout status deployment/dchat-relays -n mainnet --timeout=10m
          kubectl get pods -n mainnet -l app=dchat-relay

  smoke-test-mainnet:
    name: Mainnet Smoke Tests
    runs-on: ubuntu-latest
    needs: [deploy-mainnet-validators, deploy-mainnet-relays]
    if: github.event.inputs.skip_smoke_tests != 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.version }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Wait for network stabilization
        run: sleep 120

      - name: Health check - Validators
        run: |
          for i in {1..30}; do
            STATUS=$(curl -s -o /dev/null -w '%{http_code}' https://validators.dchat.network/health)
            if [ $STATUS -eq 200 ]; then
              echo "✅ Validator health check passed"
              break
            fi
            echo "Validator health check attempt $i/30..."
            sleep 10
          done

      - name: Health check - Relays
        run: |
          for i in {1..30}; do
            STATUS=$(curl -s -o /dev/null -w '%{http_code}' https://relay.dchat.network/health)
            if [ $STATUS -eq 200 ]; then
              echo "✅ Relay health check passed"
              break
            fi
            echo "Relay health check attempt $i/30..."
            sleep 10
          done

      - name: Test blockchain RPC
        run: |
          BLOCK_HEIGHT=$(curl -s https://validators.dchat.network/rpc/block/latest | jq -r '.height')
          echo "Current block height: $BLOCK_HEIGHT"
          if [ "$BLOCK_HEIGHT" -lt 1 ]; then
            echo "❌ Blockchain not producing blocks!"
            exit 1
          fi

      - name: Test P2P connectivity
        run: |
          PEER_COUNT=$(curl -s https://relay.dchat.network/metrics | grep 'dchat_peer_count' | awk '{print $2}')
          echo "Connected peers: $PEER_COUNT"
          if [ "$PEER_COUNT" -lt 3 ]; then
            echo "⚠️  Warning: Low peer count"
          fi

      - name: Run lightweight integration test
        run: |
          cargo test --test mainnet_smoke_test --features mainnet -- \
            --test-threads=1 \
            --nocapture

  monitor-mainnet-launch:
    name: Monitor Mainnet Launch
    runs-on: ubuntu-latest
    needs: smoke-test-mainnet
    steps:
      - name: Monitor for 30 minutes
        run: |
          echo "🔍 Monitoring mainnet launch metrics..."
          sleep 1800

      - name: Check error rates
        run: |
          ERROR_RATE=$(curl -s "https://prometheus.dchat.network/api/v1/query?query=rate(dchat_errors_total[10m])" | jq -r '.data.result[0].value[1]')
          echo "Error rate: $ERROR_RATE"
          if (( $(echo "$ERROR_RATE > 0.01" | bc -l) )); then
            echo "⚠️  High error rate detected!"
          fi

      - name: Check consensus health
        run: |
          MISSED_BLOCKS=$(curl -s "https://prometheus.dchat.network/api/v1/query?query=dchat_validator_missed_blocks_total" | jq -r '.data.result[0].value[1]')
          echo "Missed blocks: $MISSED_BLOCKS"
          if [ "$MISSED_BLOCKS" -gt 10 ]; then
            echo "⚠️  High number of missed blocks!"
          fi

      - name: Check network connectivity
        run: |
          AVG_PEERS=$(curl -s "https://prometheus.dchat.network/api/v1/query?query=avg(dchat_peer_count)" | jq -r '.data.result[0].value[1]')
          echo "Average peer count: $AVG_PEERS"
          if (( $(echo "$AVG_PEERS < 5" | bc -l) )); then
            echo "⚠️  Low network connectivity!"
          fi

  notify-mainnet-deployment:
    name: Notify Mainnet Deployment Status
    runs-on: ubuntu-latest
    needs: [monitor-mainnet-launch]
    if: always()
    steps:
      - name: Send Slack notification
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          text: |
            🚀 MAINNET DEPLOYMENT ${{ job.status == 'success' && 'SUCCESSFUL' || 'FAILED' }} 🚀
            Version: ${{ github.event.inputs.version }}
            Deployment Type: ${{ github.event.inputs.deployment_type }}
            Deployed by: ${{ github.actor }}
            Chain ID: ${{ env.MAINNET_CHAIN_ID }}
            
            Validators: https://validators.dchat.network
            Relays: https://relay.dchat.network
            Block Explorer: https://explorer.dchat.network
          webhook_url: ${{ secrets.SLACK_WEBHOOK }}

      - name: Send Discord notification
        if: always()
        run: |
          curl -X POST "${{ secrets.DISCORD_WEBHOOK }}" \
            -H "Content-Type: application/json" \
            -d '{
              "content": "🚀 **MAINNET DEPLOYMENT**",
              "embeds": [{
                "title": "dchat Mainnet ${{ github.event.inputs.version }}",
                "description": "Deployment ${{ job.status }}",
                "color": ${{ job.status == 'success' && '3066993' || '15158332' }},
                "fields": [
                  {"name": "Version", "value": "${{ github.event.inputs.version }}", "inline": true},
                  {"name": "Chain ID", "value": "${{ env.MAINNET_CHAIN_ID }}", "inline": true},
                  {"name": "Deployed by", "value": "${{ github.actor }}", "inline": true}
                ]
              }]
            }'

      - name: Update deployment tracking
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createDeployment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: '${{ github.event.inputs.version }}',
              environment: 'mainnet',
              auto_merge: false,
              required_contexts: []
            }).then(async (deployment) => {
              await github.rest.repos.createDeploymentStatus({
                owner: context.repo.owner,
                repo: context.repo.repo,
                deployment_id: deployment.data.id,
                state: '${{ needs.monitor-mainnet-launch.result }}' === 'success' ? 'success' : 'failure',
                environment_url: 'https://dchat.network',
                description: 'Mainnet deployment ${{ github.event.inputs.version }}'
              });
            });

  rollback-on-failure:
    name: Automatic Rollback
    runs-on: ubuntu-latest
    needs: [smoke-test-mainnet, monitor-mainnet-launch]
    if: failure() && github.event.inputs.deployment_type != 'rollback'
    steps:
      - name: Configure Kubernetes
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.MAINNET_KUBECONFIG }}" | base64 -d > ~/.kube/config

      - name: Rollback validators
        run: |
          kubectl rollout undo statefulset/dchat-validators -n mainnet || echo "No rollback available"

      - name: Rollback relays
        run: |
          kubectl rollout undo deployment/dchat-relays -n mainnet || echo "No rollback available"

      - name: Send critical alert
        uses: 8398a7/action-slack@v3
        with:
          status: failure
          text: |
            🚨 CRITICAL: MAINNET DEPLOYMENT FAILED - AUTOMATIC ROLLBACK INITIATED 🚨
            Version: ${{ github.event.inputs.version }}
            Chain ID: ${{ env.MAINNET_CHAIN_ID }}
            Action Required: Manual investigation needed!
          webhook_url: ${{ secrets.SLACK_WEBHOOK }}
