name: Validator Onboarding

on:
  workflow_dispatch:
    inputs:
      validator_name:
        description: 'Validator name/identifier'
        required: true
        type: string
      validator_address:
        description: 'Validator public address'
        required: true
        type: string
      stake_amount:
        description: 'Initial stake amount (tokens)'
        required: true
        type: string
      network:
        description: 'Target network'
        required: true
        type: choice
        options:
          - mainnet
          - testnet
      region:
        description: 'Deployment region'
        required: true
        type: choice
        options:
          - us-east
          - us-west
          - eu-central
          - ap-southeast
          - ap-northeast
      validator_type:
        description: 'Validator type'
        required: true
        type: choice
        options:
          - full-validator
          - light-validator
      confirm_onboarding:
        description: 'Type "ONBOARD-VALIDATOR" to confirm'
        required: true
        type: string

env:
  MIN_STAKE_MAINNET: 100000
  MIN_STAKE_TESTNET: 1000

jobs:
  validate-onboarding:
    name: Validate Validator Onboarding
    runs-on: ubuntu-latest
    outputs:
      is_mainnet: ${{ steps.check_network.outputs.is_mainnet }}
      validator_id: ${{ steps.generate_id.outputs.validator_id }}
    steps:
      - name: Validate confirmation
        run: |
          if [ "${{ github.event.inputs.confirm_onboarding }}" != "ONBOARD-VALIDATOR" ]; then
            echo "❌ Invalid confirmation"
            exit 1
          fi

      - name: Check network
        id: check_network
        run: |
          if [ "${{ github.event.inputs.network }}" == "mainnet" ]; then
            echo "is_mainnet=true" >> $GITHUB_OUTPUT
            echo "⚠️  MAINNET VALIDATOR ONBOARDING"
          else
            echo "is_mainnet=false" >> $GITHUB_OUTPUT
          fi

      - name: Validate validator name
        run: |
          NAME="${{ github.event.inputs.validator_name }}"
          if ! echo "$NAME" | grep -qE '^[a-zA-Z0-9_-]{3,32}$'; then
            echo "❌ Invalid validator name. Must be 3-32 alphanumeric characters"
            exit 1
          fi

      - name: Validate validator address
        run: |
          ADDRESS="${{ github.event.inputs.validator_address }}"
          if ! echo "$ADDRESS" | grep -qE '^[0-9a-fA-F]{64}$'; then
            echo "❌ Invalid validator address format"
            exit 1
          fi

      - name: Validate stake amount
        run: |
          STAKE="${{ github.event.inputs.stake_amount }}"
          NETWORK="${{ github.event.inputs.network }}"
          
          if ! [[ "$STAKE" =~ ^[0-9]+$ ]]; then
            echo "❌ Invalid stake amount"
            exit 1
          fi
          
          if [ "$NETWORK" == "mainnet" ]; then
            MIN_STAKE=${{ env.MIN_STAKE_MAINNET }}
          else
            MIN_STAKE=${{ env.MIN_STAKE_TESTNET }}
          fi
          
          if [ "$STAKE" -lt "$MIN_STAKE" ]; then
            echo "❌ Stake amount too low. Minimum: $MIN_STAKE"
            exit 1
          fi
          
          echo "✅ Stake amount valid: $STAKE"

      - name: Generate validator ID
        id: generate_id
        run: |
          VALIDATOR_ID="${{ github.event.inputs.validator_name }}-$(date +%s)"
          echo "validator_id=$VALIDATOR_ID" >> $GITHUB_OUTPUT
          echo "Generated validator ID: $VALIDATOR_ID"

      - name: Check for duplicate validator
        run: |
          # Check if validator with same address already exists
          echo "Checking for existing validator with address ${{ github.event.inputs.validator_address }}..."
          # In real implementation, query blockchain or database
          echo "✅ No duplicate found"

  security-checks:
    name: Security Checks
    runs-on: ubuntu-latest
    needs: validate-onboarding
    steps:
      - name: Verify validator address ownership
        run: |
          echo "🔍 Verifying validator address ownership..."
          # In real implementation, require signature proof
          echo "⚠️  Manual verification required for mainnet validators"

      - name: Check validator reputation
        if: needs.validate-onboarding.outputs.is_mainnet == 'true'
        run: |
          echo "🔍 Checking validator reputation..."
          # In real implementation, check testnet history, etc.
          echo "✅ Reputation check passed"

      - name: Verify KYC/compliance
        if: needs.validate-onboarding.outputs.is_mainnet == 'true'
        run: |
          echo "⚠️  KYC verification required for mainnet validators"
          echo "Manual approval needed from compliance team"

  provision-infrastructure:
    name: Provision Validator Infrastructure
    runs-on: ubuntu-latest
    needs: [validate-onboarding, security-checks]
    environment:
      name: ${{ github.event.inputs.network }}-validators
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure Kubernetes
        run: |
          mkdir -p ~/.kube
          if [ "${{ github.event.inputs.network }}" == "mainnet" ]; then
            echo "${{ secrets.MAINNET_KUBECONFIG }}" | base64 -d > ~/.kube/config
          else
            echo "${{ secrets.TESTNET_KUBECONFIG }}" | base64 -d > ~/.kube/config
          fi

      - name: Create validator namespace
        run: |
          NETWORK="${{ github.event.inputs.network }}"
          kubectl create namespace $NETWORK-validators --dry-run=client -o yaml | kubectl apply -f -

      - name: Generate validator keys
        run: |
          echo "🔐 Generating validator keys..."
          mkdir -p ./validator-keys
          
          # Generate keys (in real implementation, use proper key generation)
          openssl rand -hex 32 > ./validator-keys/validator-private-key.txt
          
          echo "⚠️  IMPORTANT: Backup these keys securely!"

      - name: Create Kubernetes secrets
        run: |
          NETWORK="${{ github.event.inputs.network }}"
          VALIDATOR_ID="${{ needs.validate-onboarding.outputs.validator_id }}"
          
          kubectl create secret generic $VALIDATOR_ID-keys \
            --from-file=./validator-keys/validator-private-key.txt \
            --namespace $NETWORK-validators \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Upload keys backup
        uses: actions/upload-artifact@v4
        with:
          name: ${{ needs.validate-onboarding.outputs.validator_id }}-keys
          path: ./validator-keys/
          retention-days: 7

      - name: Clean up local keys
        if: always()
        run: rm -rf ./validator-keys

  deploy-validator-node:
    name: Deploy Validator Node
    runs-on: ubuntu-latest
    needs: [validate-onboarding, provision-infrastructure]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure Kubernetes
        run: |
          mkdir -p ~/.kube
          if [ "${{ github.event.inputs.network }}" == "mainnet" ]; then
            echo "${{ secrets.MAINNET_KUBECONFIG }}" | base64 -d > ~/.kube/config
          else
            echo "${{ secrets.TESTNET_KUBECONFIG }}" | base64 -d > ~/.kube/config
          fi

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: '3.13.0'

      - name: Deploy validator with Helm
        run: |
          NETWORK="${{ github.event.inputs.network }}"
          VALIDATOR_ID="${{ needs.validate-onboarding.outputs.validator_id }}"
          VALIDATOR_NAME="${{ github.event.inputs.validator_name }}"
          REGION="${{ github.event.inputs.region }}"
          
          helm upgrade --install $VALIDATOR_ID ./helm/dchat-validator \
            --namespace $NETWORK-validators \
            --create-namespace \
            --set validator.name=$VALIDATOR_NAME \
            --set validator.address=${{ github.event.inputs.validator_address }} \
            --set validator.stake=${{ github.event.inputs.stake_amount }} \
            --set validator.type=${{ github.event.inputs.validator_type }} \
            --set validator.region=$REGION \
            --set network=$NETWORK \
            --set image.repository=ghcr.io/dchat/dchat \
            --set image.tag=latest \
            --values ./helm/dchat-validator/values-$NETWORK.yaml \
            --wait \
            --timeout 15m

      - name: Verify deployment
        run: |
          NETWORK="${{ github.event.inputs.network }}"
          VALIDATOR_ID="${{ needs.validate-onboarding.outputs.validator_id }}"
          
          kubectl rollout status statefulset/$VALIDATOR_ID -n $NETWORK-validators --timeout=10m
          kubectl get pods -n $NETWORK-validators -l validator=$VALIDATOR_ID

  register-on-chain:
    name: Register Validator On-Chain
    runs-on: ubuntu-latest
    needs: [validate-onboarding, deploy-validator-node]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build CLI tool
        run: cargo build --release --bin dchat

      - name: Register validator on blockchain
        run: |
          NETWORK="${{ github.event.inputs.network }}"
          VALIDATOR_ADDRESS="${{ github.event.inputs.validator_address }}"
          STAKE="${{ github.event.inputs.stake_amount }}"
          
          if [ "$NETWORK" == "mainnet" ]; then
            RPC_URL="https://validators.dchat.network"
          else
            RPC_URL="https://testnet.dchat.network"
          fi
          
          ./target/release/dchat validator register \
            --rpc-url $RPC_URL \
            --address $VALIDATOR_ADDRESS \
            --stake $STAKE \
            --name "${{ github.event.inputs.validator_name }}"
          
          echo "✅ Validator registered on-chain"

      - name: Verify registration
        run: |
          NETWORK="${{ github.event.inputs.network }}"
          VALIDATOR_ADDRESS="${{ github.event.inputs.validator_address }}"
          
          if [ "$NETWORK" == "mainnet" ]; then
            RPC_URL="https://validators.dchat.network"
          else
            RPC_URL="https://testnet.dchat.network"
          fi
          
          ./target/release/dchat validator info \
            --rpc-url $RPC_URL \
            --address $VALIDATOR_ADDRESS

  health-check:
    name: Validator Health Check
    runs-on: ubuntu-latest
    needs: [validate-onboarding, deploy-validator-node, register-on-chain]
    steps:
      - name: Wait for validator to sync
        run: sleep 120

      - name: Check validator status
        run: |
          NETWORK="${{ github.event.inputs.network }}"
          VALIDATOR_ID="${{ needs.validate-onboarding.outputs.validator_id }}"
          
          if [ "$NETWORK" == "mainnet" ]; then
            RPC_URL="https://validators.dchat.network"
          else
            RPC_URL="https://testnet.dchat.network"
          fi
          
          STATUS=$(curl -s $RPC_URL/validators/${{ github.event.inputs.validator_address }}/status | jq -r '.status')
          echo "Validator status: $STATUS"
          
          if [ "$STATUS" != "active" ]; then
            echo "⚠️  Validator not yet active"
          fi

      - name: Check block participation
        run: |
          NETWORK="${{ github.event.inputs.network }}"
          
          if [ "$NETWORK" == "mainnet" ]; then
            RPC_URL="https://validators.dchat.network"
          else
            RPC_URL="https://testnet.dchat.network"
          fi
          
          sleep 180  # Wait for validator to participate
          
          BLOCKS_SIGNED=$(curl -s $RPC_URL/validators/${{ github.event.inputs.validator_address }}/stats | jq -r '.blocks_signed')
          echo "Blocks signed: $BLOCKS_SIGNED"

      - name: Check P2P connectivity
        run: |
          NETWORK="${{ github.event.inputs.network }}"
          VALIDATOR_ID="${{ needs.validate-onboarding.outputs.validator_id }}"
          
          kubectl logs -n $NETWORK-validators -l validator=$VALIDATOR_ID --tail=50 | grep -i "peer\|connected"

  setup-monitoring:
    name: Setup Validator Monitoring
    runs-on: ubuntu-latest
    needs: [validate-onboarding, deploy-validator-node]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure monitoring
        run: |
          NETWORK="${{ github.event.inputs.network }}"
          VALIDATOR_ID="${{ needs.validate-onboarding.outputs.validator_id }}"
          VALIDATOR_NAME="${{ github.event.inputs.validator_name }}"
          
          echo "Setting up Prometheus monitoring for $VALIDATOR_NAME..."

      - name: Create Grafana dashboard
        run: |
          echo "Creating Grafana dashboard for validator monitoring..."
          # In real implementation, create dashboard via Grafana API

      - name: Setup alerting
        run: |
          VALIDATOR_ADDRESS="${{ github.event.inputs.validator_address }}"
          
          echo "Configuring alerts for:"
          echo "- Missed blocks"
          echo "- Low uptime"
          echo "- Peer connectivity issues"
          echo "- Stake changes"

  notify-onboarding-complete:
    name: Notify Onboarding Complete
    runs-on: ubuntu-latest
    needs: [validate-onboarding, deploy-validator-node, register-on-chain, health-check, setup-monitoring]
    if: always()
    steps:
      - name: Determine status
        id: status
        run: |
          if [ "${{ needs.health-check.result }}" == "success" ]; then
            echo "status=success" >> $GITHUB_OUTPUT
          else
            echo "status=failure" >> $GITHUB_OUTPUT
          fi

      - name: Generate onboarding report
        run: |
          cat << EOF > onboarding-report.md
          # Validator Onboarding Report
          
          ## Validator Information
          - **Name:** ${{ github.event.inputs.validator_name }}
          - **ID:** ${{ needs.validate-onboarding.outputs.validator_id }}
          - **Address:** ${{ github.event.inputs.validator_address }}
          - **Network:** ${{ github.event.inputs.network }}
          - **Region:** ${{ github.event.inputs.region }}
          - **Type:** ${{ github.event.inputs.validator_type }}
          - **Stake:** ${{ github.event.inputs.stake_amount }} tokens
          - **Status:** ${{ steps.status.outputs.status }}
          
          ## Next Steps
          1. Monitor validator performance in Grafana dashboard
          2. Ensure uptime > 99.9%
          3. Join validator community channels
          4. Review validator documentation
          
          ## Important Links
          - Dashboard: https://grafana.dchat.network/d/validator-${{ needs.validate-onboarding.outputs.validator_id }}
          - Docs: https://docs.dchat.network/validators
          - Support: validators@dchat.network
          
          ## Security Reminders
          - ⚠️  Backup validator keys securely (offline storage recommended)
          - ⚠️  Enable 2FA on all accounts
          - ⚠️  Monitor for suspicious activity
          - ⚠️  Keep software updated
          EOF
          
          cat onboarding-report.md

      - name: Upload onboarding report
        uses: actions/upload-artifact@v4
        with:
          name: onboarding-report-${{ needs.validate-onboarding.outputs.validator_id }}
          path: onboarding-report.md
          retention-days: 365

      - name: Send Slack notification
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ steps.status.outputs.status }}
          text: |
            ${{ steps.status.outputs.status == 'success' && '✅' || '❌' }} Validator Onboarding ${{ steps.status.outputs.status == 'success' && 'Complete' || 'Failed' }}
            
            **Validator:** ${{ github.event.inputs.validator_name }}
            **Network:** ${{ github.event.inputs.network }}
            **Address:** ${{ github.event.inputs.validator_address }}
            **Stake:** ${{ github.event.inputs.stake_amount }} tokens
            
            Dashboard: https://grafana.dchat.network/d/validator-${{ needs.validate-onboarding.outputs.validator_id }}
          webhook_url: ${{ secrets.SLACK_WEBHOOK }}

      - name: Send welcome email
        if: steps.status.outputs.status == 'success'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.MAIL_SERVER }}
          server_port: ${{ secrets.MAIL_PORT }}
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "Welcome to dchat Validator Network"
          to: ${{ secrets.VALIDATOR_CONTACT_EMAIL }}
          from: dchat Network <noreply@dchat.network>
          body: |
            Welcome to the dchat validator network!
            
            Your validator has been successfully onboarded:
            
            Name: ${{ github.event.inputs.validator_name }}
            Network: ${{ github.event.inputs.network }}
            Address: ${{ github.event.inputs.validator_address }}
            
            Dashboard: https://grafana.dchat.network/d/validator-${{ needs.validate-onboarding.outputs.validator_id }}
            
            Please review the attached onboarding report for important next steps.
            
            Welcome to the network!
          attachments: onboarding-report.md

      - name: Create GitHub issue for tracking
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: 'Validator Onboarded: ${{ github.event.inputs.validator_name }}',
              body: `
              ## Validator Details
              - Name: ${{ github.event.inputs.validator_name }}
              - ID: ${{ needs.validate-onboarding.outputs.validator_id }}
              - Address: ${{ github.event.inputs.validator_address }}
              - Network: ${{ github.event.inputs.network }}
              - Stake: ${{ github.event.inputs.stake_amount }} tokens
              - Status: ${{ steps.status.outputs.status }}
              - Onboarded by: @${{ github.actor }}
              
              [View Workflow Run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
              `,
              labels: ['validator', 'onboarding', '${{ github.event.inputs.network }}']
            });
