name: Production Safety Checks

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  check-no-mocks:
    name: Verify no mock code in release builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
      
      - name: Check for MockStakingVerifier in release build
        run: |
          echo "Checking for mock implementations in release builds..."
          
          # Build in release mode and check for mock symbols
          if cargo build --release 2>&1 | grep -i "MockStakingVerifier"; then
            echo "❌ ERROR: MockStakingVerifier found in release build!"
            echo "This is a critical security issue. Mocks must not be compiled into production."
            exit 1
          fi
          
          # Check that ChainStakingVerifier is present
          if ! cargo build --release 2>&1 | grep -q "ChainStakingVerifier"; then
            echo "⚠️  WARNING: ChainStakingVerifier not found in build output"
          fi
          
          echo "✅ No mock implementations found in release build"
      
      - name: Verify feature gates
        run: |
          echo "Verifying test-mocks feature is not enabled by default..."
          
          # Check Cargo.toml files for default feature inclusion of test-mocks
          if grep -r "default.*test-mocks" --include="Cargo.toml" .; then
            echo "❌ ERROR: test-mocks feature is in default features!"
            echo "This would include mock code in production builds."
            exit 1
          fi
          
          echo "✅ Feature gates correctly configured"
      
      - name: Check for unsafe test code markers
        run: |
          echo "Scanning for unsafe test markers in source code..."
          
          # Look for TODO or FIXME related to production readiness
          if grep -r "TODO.*production\|FIXME.*production\|INSECURE FOR PRODUCTION" \
               --include="*.rs" --exclude-dir=target --exclude-dir=tests .; then
            echo "⚠️  WARNING: Found production readiness markers"
            echo "Review these before mainnet launch!"
            # Don't fail, just warn
          fi
          
          echo "✅ Safety checks complete"
      
      - name: Verify secrets not logged
        run: |
          echo "Checking for potential secret logging..."
          
          # Check for common patterns that might log secrets
          if grep -r "tracing::.*passphrase\|println!.*secret\|dbg!(.*key" \
               --include="*.rs" --exclude-dir=target .; then
            echo "❌ ERROR: Potential secret logging detected!"
            echo "Never log passwords, keys, or secrets."
            exit 1
          fi
          
          echo "✅ No obvious secret logging found"

  check-dependencies:
    name: Security audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        
      - name: Install cargo-audit
        run: cargo install cargo-audit
        
      - name: Run security audit
        run: cargo audit
        
      - name: Check for deprecated dependencies
        run: cargo outdated --exit-code 1 || true
