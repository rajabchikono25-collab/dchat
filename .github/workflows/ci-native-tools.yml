name: CI (native tools)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Rust
      uses: actions-rs/toolchain@v1
      with:
        toolchain: stable
        profile: minimal

    - name: Install native build tools (Linux)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake nasm pkg-config build-essential

    - name: Install native build tools (macOS)
      if: runner.os == 'macOS'
      run: |
        brew update || true
        brew install cmake nasm || true

    - name: Install native build tools (Windows)
      if: runner.os == 'Windows'
      shell: powershell
      run: |
        choco install -y cmake nasm || true

    - name: Cache cargo registry
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
        key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

    - name: Build and run tests
      env:
        RUST_BACKTRACE: 1
      run: |
        cargo test --workspace
