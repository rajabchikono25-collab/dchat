# DChat Mainnet Validator Configuration
# For genesis validators launching the mainnet

[network]
listen_addresses = ["/ip4/0.0.0.0/tcp/7070", "/ip4/0.0.0.0/udp/7070/quic-v1"]

# Bootstrap peers - full multiaddr with PeerId
# These are all genesis validators
bootstrap_peers = [
  "/dns4/ind.firebirdcomputing.com/tcp/7070/p2p/12D3KooWF8LZv7S9QUCWgAYT5FtUJCbeSByV4kA1oBCiBwwbnGVo",
  "/dns4/sa.firebirdcomputing.com/tcp/7070/p2p/12D3KooWAKbBgdNpBJViGVWVhuK4keAKfy3zBGX9GikYYXPMBBNw",
  "/dns4/uae.firebirdcomputing.com/tcp/7070/p2p/12D3KooWJFoqm3BhLm8g5eiuYcpycHpNjbV6FacvN9LimHUZ1jVu",
]

max_connections = 200
connection_timeout_ms = 15000
enable_mdns = false           # Disabled for mainnet
enable_upnp = false           # Disabled - using manual external_address

# External address - bypasses NAT detection
# SET THIS TO THE PUBLIC IP OF THIS SERVER
external_address = "/ip4/74.225.183.196/tcp/7070"

[storage]
data_dir = "./dchat_mainnet_data"
# Using CockroachDB for mainnet
database_url = "postgresql://rajab:sLiaFpvhwzPSBEnvBoc2jg@absurd-auroch-17923.j77.cockroachlabs.cloud:26257/dchat?sslmode=verify-full"
max_message_cache_size = 100000
message_retention_days = 365
enable_backup = true
backup_interval_hours = 1

# Production database settings
db_pool_size = 50
db_connection_timeout_secs = 30
db_idle_timeout_secs = 600
db_max_lifetime_secs = 1800
db_enable_wal = true

# MinIO Object Storage - optional for mainnet launch
[storage.minio]
endpoint = "http://localhost:9000"
access_key = "dchat_admin"
secret_key = "dchat_secure_password_change_me"
region = "us-east-1"
use_ssl = false

# Bucket configuration
[storage.buckets]
default = "dchat-mainnet"
media = "dchat-media"
attachments = "dchat-attachments"
backups = "dchat-backups"
avatars = "dchat-avatars"
channels = "dchat-channels"

# Redis - optional for mainnet launch
[storage.redis]
url = "redis://localhost:6379"
pool_size = 20
connection_timeout_secs = 5
command_timeout_secs = 3
max_retries = 3

# TiKV - optional for mainnet launch
[storage.tikv]
pd_endpoints = ["http://localhost:2379"]
timeout_secs = 10
keepalive_secs = 30
max_retries = 3

[crypto]
key_rotation_interval_hours = 168                            # 1 week
max_messages_per_key = 10000
enable_post_quantum = false
noise_protocol_pattern = "Noise_XX_25519_ChaChaPoly_BLAKE2s"

[governance]
voting_period_hours = 168         # 1 week
minimum_stake_for_proposal = 1000
quorum_threshold = 0.33           # 33% - minimum allowed for production
enable_anonymous_voting = true

[relay]
enable_relay = false                   # Not a relay node
max_relay_connections = 100
relay_reward_threshold = 100
uptime_reporting_interval_minutes = 60
stake_amount = 0

[monitoring]
# Prometheus metrics
metrics_enabled = true
metrics_port = 9090

# Distributed tracing
tracing_enabled = false
tracing_endpoint = "http://localhost:4317"

# Health checks
health_check_enabled = true
health_check_port = 8080
